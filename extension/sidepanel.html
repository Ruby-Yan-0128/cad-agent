<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; background: #1e1e1e; color: #e5e5e5; }
    label { display: block; font-size: 12px; margin-top: 10px; color: #aaa; }
    input, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; font-family: monospace; }
    textarea { height: 180px; resize: vertical; }
    button { margin-top: 10px; width: 100%; padding: 8px; background: #0e639c; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    button:hover { background: #1177bb; }
    #status { margin-top: 10px; font-size: 12px; white-space: pre-wrap; color: #9cdcfe; }
    #preview { width: 100%; margin-top: 10px; border-radius: 4px; display: none; border: 1px solid #444; }
    #download { display: none; margin-top: 8px; color: #4ec9b0; font-size: 13px; }
  </style>
</head>
<body>
  <h3 style="margin: 0 0 8px 0;">CAD Agent</h3>

  <label for="filename">Model filename (inside models/)</label>
  <input id="filename" type="text" value="l_bracket.py" />

  <label for="code">build123d script (leave blank to just render existing file)</label>
  <textarea id="code" placeholder="Paste build123d Python code here..."></textarea>

  <button id="runBtn">Run &amp; Render</button>

  <div id="status"></div>
  <img id="preview" alt="Rendered CAD views" />
  <a id="download" target="_blank">Download STEP file</a>

  <script src="sidepanel.js"></script>
</body>
</html>
